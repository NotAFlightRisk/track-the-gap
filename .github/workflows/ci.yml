name: 🚦 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.emoji }} ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: format
            emoji: 🎨
            run: npm run format:check
          - label: types
            emoji: 🔬
            run: npm run check
          - label: tests
            emoji: 🧪
            run: npm test
          - label: build
            emoji: 🏗️
            run: npm run build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  image:
    name: 🐋 image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: track-the-gap:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serve it and see if it answers
        run: |
          docker run -d --name ci -p 3000:3000 track-the-gap:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              echo "up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          docker logs ci
          exit 1

  summary:
    name: 📋 summary
    runs-on: ubuntu-latest
    needs: [check, image]
    if: always()
    steps:
      - name: Write the summary
        env:
          CHECKS: ${{ needs.check.result }}
          IMAGE: ${{ needs.image.result }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ passed" ;;
              skipped) echo "⏭️ skipped" ;;
              cancelled) echo "🚫 cancelled" ;;
              failure) echo "❌ failed" ;;
              *) echo "❔ $1" ;;
            esac
          }
          {
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| 🔍 checks | $(icon "$CHECKS") |"
            echo "| 🐋 image | $(icon "$IMAGE") |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$CHECKS" = "success" ] && [ "$IMAGE" = "success" ]
